[package]
name = "aionc"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
inkwell = { version = "0.8.0", features = ["llvm15-0"] }
thiserror = "2"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
tempfile = "3"
