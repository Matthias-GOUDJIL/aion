name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tests/tmp directory
        run: mkdir -p tests/tmp

      - name: Build Docker image
        run: docker build -t aion-compiler .

      - name: Run integration tests
        run: |
          docker run --rm \
            -v "$(pwd)":/workspace \
            -w /workspace \
            aion-compiler \
            bash -c "mkdir -p tests/tmp && INSTA_UPDATE=always cargo test -- --test-threads=1"
