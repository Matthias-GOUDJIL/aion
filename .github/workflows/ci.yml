name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create tests/tmp directory
        run: mkdir -p tests/tmp

      - name: Build Docker image
        run: docker build -t aion-compiler .

      - name: Run integration tests
        run: cargo test
