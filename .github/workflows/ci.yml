name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title follows conventional commit format
        run: |
          title="${{ github.event.pull_request.title }}"
          echo "PR title: $title"
          if echo "$title" | grep -qP '^(feat|fix|refactor|docs|test|chore|style|perf|build|ci)(\(.+\))?: '; then
            echo "ok"
          else
            echo "PR title must match: type: description (e.g. feat: add foo, fix: correct bar)"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tests/tmp directory
        run: mkdir -p tests/tmp

      - name: Build Docker image
        run: docker build -t aion-compiler .

      - name: Run integration tests
        run: |
          docker run --rm \
            -v "$(pwd)":/workspace \
            -w /workspace \
            aion-compiler \
            bash -c "mkdir -p tests/tmp && INSTA_UPDATE=always cargo test -- --test-threads=1"

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aion-compiler .

      - name: Run clippy with -D warnings
        run: |
          docker run --rm \
            -v "$(pwd)":/workspace \
            -w /workspace \
            aion-compiler \
            cargo clippy --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aion-compiler .

      - name: Check formatting
        run: |
          docker run --rm \
            -v "$(pwd)":/workspace \
            -w /workspace \
            aion-compiler \
            cargo fmt --check

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against documentation drift
        run: bash scripts/docs-check.sh
